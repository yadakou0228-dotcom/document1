<title>Python基礎 30日プラン</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1:wght@700;800&family=BIZ+UDPGothic:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 1カラムの学習ノート。ホーム=診断結果・今日の課題・12単元の進捗グリッド／単元=要点→小テスト／模擬試験=タイマー付き40問 */
:root {
  --bg: #f2f4f8;
  --surface: #ffffff;
  --sunk: #e9edf4;
  --ink: #172031;
  --muted: #586378;
  --line: #d3d9e4;
  --accent: #2753c4;
  --accent-ink: #ffffff;
  --accent-soft: #e0e8fb;
  --marker: #f4cf52;
  --marker-soft: #fcf1cc;
  --good: #20804d;  --good-soft: #dff2e6;
  --bad: #bf3a2c;   --bad-soft: #f9e2df;
  --warn: #9c6300;  --warn-soft: #f8ecd4;
  --code-bg: #1a2131;
  --code-ink: #e5eaf4;
  --code-dim: #8d99b0;
  --font-display: "M PLUS 1", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131b; --surface: #161d28; --sunk: #111721; --ink: #e3e8f1; --muted: #95a1b5; --line: #283244;
    --accent: #7c9fff; --accent-ink: #0e131b; --accent-soft: #1b2847;
    --marker: #e2b93e; --marker-soft: #322a12;
    --good: #5dc98b; --good-soft: #16301f; --bad: #ef7d70; --bad-soft: #3a1f1c; --warn: #e3aa4c; --warn-soft: #33270f;
    --code-bg: #0a0e15; --code-ink: #e5eaf4; --code-dim: #7d889c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131b; --surface: #161d28; --sunk: #111721; --ink: #e3e8f1; --muted: #95a1b5; --line: #283244;
  --accent: #7c9fff; --accent-ink: #0e131b; --accent-soft: #1b2847;
  --marker: #e2b93e; --marker-soft: #322a12;
  --good: #5dc98b; --good-soft: #16301f; --bad: #ef7d70; --bad-soft: #3a1f1c; --warn: #e3aa4c; --warn-soft: #33270f;
  --code-bg: #0a0e15; --code-ink: #e5eaf4; --code-dim: #7d889c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.75;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 64px;
}
.wrap { max-width: 860px; margin: 0 auto; display: grid; gap: 28px; }
a { color: var(--accent); }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 18px 0; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand .mark { font-family: var(--font-code); font-weight: 700; font-size: 13px; background: var(--code-bg); color: var(--marker); padding: 3px 8px; border-radius: 6px; }
.brand b { font-family: var(--font-display); font-weight: 800; font-size: 17px; }
.sync { font-size: 12px; color: var(--muted); }

h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.35; }
h1 { font-size: clamp(26px, 4.6vw, 36px); font-weight: 800; }
h2 { font-size: 21px; font-weight: 800; }
h3 { font-size: 17px; font-weight: 700; }
.eyebrow { font-size: 12px; letter-spacing: .1em; font-weight: 700; color: var(--accent); }
.lead { color: var(--muted); margin: 6px 0 0; max-width: 62ch; }
.hl { background: linear-gradient(transparent 58%, var(--marker-soft) 58%); font-weight: 700; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
.stack { display: grid; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 9px 16px; font-weight: 700; font-size: 14px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

/* exam facts strip */
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
.facts div { padding: 12px 14px; border-left: 1px solid var(--line); }
.facts div:first-child { border-left: 0; }
.facts dt { font-size: 12px; color: var(--muted); }
.facts dd { margin: 0; font-family: var(--font-code); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.facts dd small { font-family: var(--font-body); font-size: 12px; font-weight: 400; color: var(--muted); }
@media (max-width: 560px) { .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); } .facts div:nth-child(3) { border-left: 0; } .facts div:nth-child(n+3) { border-top: 1px solid var(--line); } }

/* steps */
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.step { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--surface); display: grid; gap: 2px; }
.step .n { font-family: var(--font-code); font-size: 12px; color: var(--muted); }
.step b { font-size: 14px; }
.step span { font-size: 12px; color: var(--muted); }
.step.done { border-color: var(--good); background: var(--good-soft); }
.step.now { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
@media (max-width: 560px) { .steps { grid-template-columns: 1fr; } }

/* today */
.today { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; }
.daybig { font-family: var(--font-code); text-align: center; background: var(--code-bg); color: var(--code-ink); border-radius: 10px; padding: 10px 16px; min-width: 92px; }
.daybig small { display: block; font-size: 11px; color: var(--code-dim); letter-spacing: .08em; }
.daybig b { font-size: 34px; line-height: 1.1; color: var(--marker); font-variant-numeric: tabular-nums; }
.daybig span { font-size: 12px; color: var(--code-dim); }
.today p { margin: 0; }
.bar { height: 10px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.meta { font-size: 13px; color: var(--muted); }
.meta b { color: var(--ink); font-family: var(--font-code); font-variant-numeric: tabular-nums; }
input[type=date] { font: inherit; font-size: 13px; color: var(--ink); background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }

/* level */
.level { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 18px; }
@media (max-width: 640px) { .level, .today { grid-template-columns: 1fr; } .daybig { justify-self: start; } }
.lv-badge { display: inline-block; font-family: var(--font-display); font-weight: 800; font-size: 13px; padding: 2px 10px; border-radius: 99px; background: var(--marker); color: #2a2205; }
.lv-score { font-family: var(--font-code); font-size: 44px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.lv-score small { font-size: 16px; color: var(--muted); }
.minibars { display: grid; gap: 4px; font-size: 12px; }
.minibars div { display: grid; grid-template-columns: 7.5em minmax(0, 1fr) 2.6em; gap: 8px; align-items: center; }
.minibars em { font-style: normal; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.minibars .bar { height: 7px; }
.minibars .bar i.ok { background: var(--good); }
.minibars .bar i.ng { background: var(--bad); }
.minibars code { font-family: var(--font-code); text-align: right; font-size: 12px; }

/* unit grid */
.units { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.ucard { display: grid; gap: 6px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink); position: relative; }
.ucard:hover { border-color: var(--accent); }
.ucard .head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.ucard .no { font-family: var(--font-code); font-size: 12px; color: var(--muted); }
.ucard b { font-size: 15px; line-height: 1.45; }
.ucard .sub { font-size: 12px; color: var(--muted); }
.chip { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 99px; white-space: nowrap; border: 1px solid transparent; }
.chip.todo { background: var(--sunk); color: var(--muted); }
.chip.prog { background: var(--warn-soft); color: var(--warn); }
.chip.pass { background: var(--good-soft); color: var(--good); }
.chip.skip { background: var(--accent-soft); color: var(--accent); }
.chip.fail { background: var(--bad-soft); color: var(--bad); }
.ucard.is-pass { border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
.ucard.is-today { box-shadow: inset 0 0 0 2px var(--accent); }

table.hist { width: 100%; border-collapse: collapse; font-size: 14px; }
table.hist th, table.hist td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.hist th { font-size: 12px; color: var(--muted); font-weight: 400; }
table.hist td.num { font-family: var(--font-code); font-variant-numeric: tabular-nums; }

/* lesson */
.lesson-head { display: grid; gap: 6px; }
.crumbs { font-size: 13px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.points { display: grid; gap: 14px; counter-reset: pt; }
.point { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 8px; min-width: 0; }
.point h3 { font-size: 16px; }
.point p { margin: 0; }
.point ul { margin: 0; padding-left: 1.2em; }
.trap { background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 35%, var(--line)); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
.trap b { color: var(--warn); }
pre { margin: 0; background: var(--code-bg); color: var(--code-ink); border-radius: 8px; padding: 12px 14px; overflow-x: auto; font-family: var(--font-code); font-size: 13.5px; line-height: 1.6; tab-size: 4; }
pre .c { color: var(--code-dim); }
pre .p { color: var(--marker); }
code.i { font-family: var(--font-code); font-size: .92em; background: var(--sunk); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; white-space: nowrap; }

/* quiz */
.quiz { display: grid; gap: 14px; }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 10px; min-width: 0; }
.q .qh { display: flex; gap: 10px; align-items: baseline; }
.q .qn { font-family: var(--font-code); font-weight: 700; color: var(--accent); font-size: 14px; white-space: nowrap; }
.q .qt { font-weight: 700; margin: 0; }
.opts { display: grid; gap: 6px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--sunk); cursor: pointer; min-width: 0; }
.opt:hover { border-color: var(--accent); }
.opt input { margin-top: 6px; accent-color: var(--accent); flex: none; }
.opt span { min-width: 0; overflow-wrap: anywhere; }
.opt code { font-family: var(--font-code); font-size: 13.5px; white-space: pre-wrap; }
.opt.idk span { color: var(--muted); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.q.graded .opt { cursor: default; }
.q.graded .opt.right { border-color: var(--good); background: var(--good-soft); }
.q.graded .opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.q.graded.ok { border-color: color-mix(in srgb, var(--good) 50%, var(--line)); }
.q.graded.ng { border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); }
.verdict-tag { font-size: 12px; font-weight: 700; margin-left: auto; white-space: nowrap; }
.verdict-tag.ok { color: var(--good); }
.verdict-tag.ng { color: var(--bad); }
.exp { font-size: 14px; border-top: 1px dashed var(--line); padding-top: 8px; color: var(--ink); }
.exp b { color: var(--accent); }
.submitbar { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; z-index: 5; }
.result { border-radius: 12px; padding: 18px 20px; display: grid; gap: 8px; border: 1px solid var(--line); }
.result.pass { background: var(--good-soft); border-color: var(--good); }
.result.fail { background: var(--bad-soft); border-color: var(--bad); }
.result .big { font-family: var(--font-code); font-size: 40px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.result .big small { font-size: 16px; color: var(--muted); }
.result p { margin: 0; }
.timer { font-family: var(--font-code); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.timer.low { color: var(--bad); }
.notice { font-size: 13px; color: var(--muted); }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
footer { font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width .4s ease; } }
</style>

<script>
/* ============================================================
   データ：単元・レッスン・問題
   Q(問題文, コード|null, 選択肢[], 正解index, 解説)
   ============================================================ */
const Q = (q, code, c, a, e) => ({ q, code, c, a, e });

const UNITS = [
{ id: 1, title: "Pythonの特徴とインタープリタ", ch: "1・2章", days: [1], weight: "2問前後",
  intro: "試験の最初に出る、知識問題中心の単元です。覚えれば確実に取れる得点源にしましょう。",
  points: [
    { h: "Pythonの特徴", body: "<ul><li>インタープリタ型。<span class='hl'>コンパイルとリンクが不要</span>で、書いてすぐ試せる。</li><li>文のまとまり（ブロック）は<span class='hl'>インデント</span>で表す。<code class='i'>{}</code> は使わない。</li><li>変数や引数の<span class='hl'>型宣言は不要</span>。</li><li>C言語などで書いた関数やモジュールを組み込める（拡張可能）。</li><li>名前の由来はBBCのコメディ番組「Monty Python's Flying Circus」。ヘビではない。</li></ul>" },
    { h: "インタープリタの起動と終了", body: "<p>ターミナルで <code class='i'>python3</code> と入力すると対話モードが始まります。終了は Unix で <code class='i'>Ctrl-D</code>、Windows で <code class='i'>Ctrl-Z</code> → Enter、またはどちらでも <code class='i'>quit()</code>。</p>",
      code: String.raw`$ python3
>>> print("こんにちは")   # >>> は一次プロンプト
こんにちは
>>> for i in range(2):   # 続きの行は ... (二次プロンプト)
...     print(i)
...
0
1`},
    { h: "コマンドラインオプション", body: "<ul><li><code class='i'>python3 -c \"コマンド\"</code> … 文字列のコマンドを実行</li><li><code class='i'>python3 -m モジュール名</code> … モジュールをスクリプトとして実行</li><li><code class='i'>python3 -i script.py</code> … スクリプト実行後に対話モードに入る</li></ul>" },
    { h: "sys.argv（引数）", body: "<p>スクリプトに渡した引数は <code class='i'>sys</code> モジュールの <code class='i'>argv</code>（文字列のリスト）に入ります。</p>",
      code: String.raw`$ python3 hello.py a b    → sys.argv == ['hello.py', 'a', 'b']
$ python3 -c "..."        → sys.argv[0] == '-c'
$ python3 -m mod          → sys.argv[0] はモジュールのフルパス
$ python3 (スクリプトなし) → sys.argv[0] == ''`},
    { h: "ソースコードのエンコーディング", body: "<p>デフォルトは <span class='hl'>UTF-8</span>。変える場合は特殊コメントを<span class='hl'>1行目</span>に書きます。1行目がシェバン（<code class='i'>#!</code>）なら<span class='hl'>2行目</span>に書きます。</p>",
      code: String.raw`#!/usr/bin/env python3
# -*- coding: cp1252 -*-`},
  ],
  quiz: [
    Q("Pythonの特徴として誤っているものはどれ？", null, ["変数や関数の引数は、使う前に型を宣言する必要がある", "文のグループ化はインデントで行う", "コンパイルとリンクの工程が不要である", "C言語などで書いた関数を組み込んで拡張できる"], 0, "Pythonは動的型付けで、<b>型宣言は不要</b>です。他の3つはチュートリアル1章に書かれている特徴そのものです。"),
    Q("次のコマンドを実行したときの出力はどれ？", String.raw`$ python3 -c "import sys; print(sys.argv[0])"`, ["-c", "（空文字列）", "python3", "import sys"], 0, "<code class='i'>-c</code> でコマンドを実行した場合、<b>sys.argv[0] は '-c'</b> になります。スクリプト名なしで起動したときは空文字列です。"),
    Q("スクリプトを実行した後、そのまま対話モードに入るオプションはどれ？", null, ["-i", "-c", "-m", "-v"], 0, "<b>-i</b> は interactive の i。スクリプト実行後に変数の中身などを対話的に確認できます。"),
    Q("Pythonのソースファイルのデフォルトの文字エンコーディングはどれ？", null, ["UTF-8", "Shift_JIS", "ASCII", "Latin-1"], 0, "Python 3 のソースコードのデフォルトは <b>UTF-8</b> です。"),
    Q("対話モードで、複数行にまたがる文の続きを入力するときに表示される二次プロンプトはどれ？", null, ["...", ">>>", "$", ">>"], 0, "一次プロンプトは <b>>>></b>、継続行の二次プロンプトは <b>...</b> です。"),
    Q("モジュールをスクリプトとして実行するコマンドはどれ？", null, ["python3 -m モジュール名", "python3 -c モジュール名", "python3 -i モジュール名", "python3 --module=モジュール名"], 0, "<b>-m</b> は module の m。例: <code class='i'>python3 -m venv env</code>。"),
    Q("「Python」という名前の由来はどれ？", null, ["BBCのコメディ番組「Monty Python's Flying Circus」", "爬虫類のニシキヘビ", "開発者の飼っていたペットの名前", "ギリシャ神話に登場する大蛇ピュートーン"], 0, "チュートリアル1章に<b>モンティ・パイソン</b>由来と明記されています。ヘビは誤り。"),
    Q("エンコーディング宣言（# -*- coding: ... -*-）を書ける位置として正しいものはどれ？", null, ["ファイルの1行目。1行目がシェバン行なら2行目", "ファイルのどこでもよい", "ファイルの最終行", "import文の直後"], 0, "エンコーディング宣言は<b>先頭行</b>。Unixのシェバン行（#!）がある場合はその<b>次の行</b>に書きます。"),
  ],
  place: [
    Q("Pythonで、if文やfor文の処理のまとまり（ブロック）を表す方法はどれ？", null, ["行頭のインデント（字下げ）", "{ } で囲む", "begin と end で囲む", "行末にセミコロンを付ける"], 0, "Pythonは<b>インデント</b>でブロックを表します。これがPython最大の特徴の一つです。"),
    Q("Pythonの対話モード（>>> が表示される画面）を終了するために入力するものはどれ？", null, ["quit()", "stop()", "close()", ":q"], 0, "<b>quit()</b> で終了します。Unixでは Ctrl-D、Windowsでは Ctrl-Z → Enter でも終了できます。"),
  ]},

{ id: 2, title: "数値と演算子", ch: "3章", days: [2, 3], weight: "3章で6問前後",
  intro: "電卓としてのPython。演算子の優先順位と、割り算・べき乗の細かいルールがよく問われます。",

    Q("対話モードの変数 _ について正しいものはどれ？", null, ["最後に表示された式の値が入っている", "最初に定義した変数の値が入っている", "直前に発生したエラーの内容が入っている", "スクリプト実行時にも常に使える組み込み定数である"], 0, "<b>対話モード</b>で最後に表示された値が入ります。電卓のように続けて計算するときに便利です。"),

ame

{ id: 4, title: "リストの基本と初めてのプログラム", ch: "3章", days: [6, 7], weight: "3章で6問前後",

    { h: "リストの作成と操作", body: "<p>角かっこで作り、インデックスとスライスは文字列と同じ。<code class='i'>+</code> で連結、<code class='i'>append()</code> で末尾に追加、<code class='i'>len()</code> で長さ。</p>",
      code: String.raw`>>> squares = [1, 4, 9, 16, 25]
>>> squares[-3:]
[9, 16, 25]
>>> squares + [36, 49]

      code: String.raw`>>> a = [1, 2, 3]

{ id: 5, title: "制御構文（if / for / range / match）", ch: "4章", days: [8, 9, 10], weight: "4章で9問前後（最多）",
  intro: "4章は出題数が最も多い章です。特に for 文の else 節と range() は毎回のように出ます。",
  points: [
    { h: "if / elif / else", body: "<p><code class='i'>elif</code> は else if の略。いくつ書いてもよく、上から順に最初に真になった1つだけが実行されます。</p>",
      code: String.raw`x = 7
if x < 0:
    print('負')
elif x == 0:
    print('ゼロ')
else:
    print('正')`},
    { h: "for 文と range()", body: "<p>for はシーケンスの要素を順番に取り出します。<code class='i'>range(開始, 終了, 刻み)</code> は<span class='hl'>終了を含まない</span>。</p>",
      code: String.raw`>>> list(range(5))
[0, 1, 2, 3, 4]
>>> list(range(5, 10))
[5, 6, 7, 8, 9]
>>> list(range(0, 10, 3))
[0, 3, 6, 9]
>>> list(range(-10, -100, -30))
[-10, -40, -70]
>>> sum(range(4))      # 0+1+2+3
6`},
    { h: "break / continue / ループの else 節", body: "<p><code class='i'>break</code> はループを抜ける、<code class='i'>continue</code> は次の周回へ。ループの <code class='i'>else</code> は<span class='hl'>break されずに最後まで回ったとき</span>だけ実行されます。</p>",
      code: String.raw`for n in range(2, 10):
    for x in range(2, n):
        if n % x == 0:
            break          # 割り切れた＝素数ではない
    else:
        print(n, 'は素数')  # break しなかったときだけ

    { h: "pass 文", body: "<p>何もしない文。文法上なにか書く必要があるけれど、処理がないときに使います（空のクラスや関数の仮置き）。</p>",
      code: String.raw`class MyEmptyClass:
    pass

def initlog(*args):
    pass   # あとで実装する`},
    { h: "match 文（Python 3.10〜）", body: "<p>値をパターンと照合します。<code class='i'>|</code> で複数パターン、<code class='i'>_</code> はワイルドカード（どれにも当たらないとき）。</p>",
      code: String.raw`def http_error(status):
    match status:
        case 400:
            return "Bad request"
        case 401 | 403 | 404:
            return "Not allowed"
        case _:
            return "Something's wrong"`},

    Q("次のコードの出力はどれ？", String.raw`print(list(range(-10, -100, -30)))`, ["[-10, -40, -70]", "[-10, -40, -70, -100]", "[]", "[-100, -70, -40, -10]"], 0, "-30 刻みで -100 に<b>達する手前</b>まで。"),

{ id: 10, title: "エラーと例外", ch: "8章", days: [22, 23], weight: "4〜5問",
  intro: "try / except / else / finally の実行順序は必ず出ます。コードを目で追えるようにしましょう。",
  points: [
    { h: "構文エラーと例外", body: "<p><span class='hl'>構文エラー（SyntaxError）</span>は実行前の解析で見つかるエラー。文法は正しくても実行中に起きるのが<span class='hl'>例外</span>です。</p>",
      code: String.raw`>>> while True print('Hello')
SyntaxError: invalid syntax
>>> 10 * (1/0)
ZeroDivisionError: division by zero
>>> 4 + spam*3
NameError: name 'spam' is not defined
>>> '2' + 2
TypeError: can only concatenate str (not "int") to str
>>> int('abc')
ValueError: invalid literal for int() with base 10: 'abc'`},
    { h: "try / except / else / finally", body: "<ul><li><code class='i'>except</code> は<span class='hl'>上から順に</span>見て、最初に一致した1つだけ実行</li><li>基底クラスの except は派生クラスの例外も捕まえる</li><li><code class='i'>else</code> は<span class='hl'>例外が起きなかったとき</span>だけ実行</li><li><code class='i'>finally</code> は<span class='hl'>必ず</span>実行（return や break があっても）</li></ul>",
      code: String.raw`def divide(x, y):
    try:
        result = x / y
    except ZeroDivisionError:
        print("division by zero!")
    else:
        print("result is", result)
    finally:
        print("executing finally clause")

divide(2, 1)   # result is 2.0 → executing finally clause
divide(2, 0)   # division by zero! → executing finally clause`},
    { h: "finally と return", body: "<p>finally 節に return があると、<span class='hl'>try 節の return より優先</span>されます。</p>",
      code: String.raw`def bool_return():
    try:
        return True
    finally:
        return False

bool_return()   # False`},
    { h: "例外を送出する：raise と連鎖", body: "<p><code class='i'>raise 例外クラスまたはインスタンス</code>。except 節の中で引数なしの <code class='i'>raise</code> を書くと、捕まえた例外を再送出します。<code class='i'>raise 新しい例外 from 元の例外</code> で連鎖を明示、<code class='i'>from None</code> で連鎖を表示しない。</p>",
      code: String.raw`try:
    raise NameError('HiThere')

    print('An exception flew by!')
    raise          # 再送出

    raise RuntimeError('Failed to open database') from exc`},
    { h: "ユーザー定義例外ほか", body: "<p>独自の例外は <span class='hl'><code class='i'>Exception</code> クラスを継承</span>して作ります。名前は「Error」で終えるのが慣習。Python 3.11 以降は複数の例外をまとめる <code class='i'>ExceptionGroup</code> と <code class='i'>except*</code>、例外にメモを付ける <code class='i'>add_note()</code> もあります。</p>",
      trap: "<b>ひっかけ注意：</b>except B → except C → except D の順に書くと、C や D の例外もすべて最初の except B で捕まります。" },
  ],
  quiz: [
    Q("次のコードの出力はどれ？", String.raw`def divide(x, y):
    try:
        result = x / y
    except ZeroDivisionError:
        print("A", end="")
    else:
        print("B", end="")
    finally:
        print("C", end="")

divide(2, 1)`, ["BC", "AC", "ABC", "B"], 0, "例外が起きないので <b>else（B）→ finally（C）</b>。"),
    Q("次のコードの出力はどれ？", String.raw`def bool_return():
    try:
        return True
    finally:
        return False

print(bool_return())`, ["False", "True", "None", "SyntaxError になる"], 0, "<b>finally の return が優先</b>されます。"),
    Q("次のコードの出力はどれ？", String.raw`class B(Exception): pass

        print("B", end="")
    except C:
        print("C", end="")
    except D:
        print("D", end="")`, ["BBB", "BCD", "DCB", "B"], 0, "C も D も B の派生クラスなので、<b>最初の except B</b> にすべて一致します。"),
    Q("int('abc') を実行したときに送出される例外はどれ？", null, ["ValueError", "TypeError", "NameError", "SyntaxError"], 0, "型（str）は受け付けるが<b>値が不適切</b>なので ValueError。"),
    Q("ある例外を処理中に、別の例外を「直接の原因」を明示して送出する書き方はどれ？", null, ["raise RuntimeError('msg') from exc", "raise RuntimeError('msg') with exc", "raise RuntimeError('msg'), exc", "raise exc as RuntimeError('msg')"], 0, "<b>raise ... from 元の例外</b> で例外の連鎖を明示します。"),
    Q("try 文で、try 節で例外が発生しなかったときだけ実行される節はどれ？", null, ["else 節", "finally 節", "except 節", "pass 節"], 0, "<b>else</b> は例外なしのときだけ。finally は例外の有無にかかわらず常に実行されます。"),
    Q("ユーザー定義の例外クラスを作るとき、通常継承するクラスはどれ？", null, ["Exception", "Error", "object", "SyntaxError"], 0, "ユーザー定義例外は <b>Exception</b>（またはその派生クラス）を継承します。"),

  ]},

/* ============================================================
   状態と保存（このブラウザ＋ログイン中はクラウドにも同期）
   ============================================================ */
const LS_KEY = "py-kiso-30d-v1";
const blank = () => ({ placement: null, units: {}, mocks: [], start: null, updatedAt: 0 });
let state = blank();
try { const raw = localStorage.getItem(LS_KEY); if (raw) state = Object.assign(blank(), JSON.parse(raw)); } catch (e) {}

let db = null, uid = null, pushTimer = null, pushing = false, pushAgain = false;
const syncEl = () => document.getElementById("sync");
function save() {
  state.updatedAt = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
  if (db && uid) { clearTimeout(pushTimer); pushTimer = setTimeout(push, 600); }
}
async function push() {
  if (!db || !uid) return;
  if (pushing) { pushAgain = true; return; }
  pushing = true;
  try {
    await db.doc("progress/" + uid).set(JSON.parse(JSON.stringify(state)));
    syncEl().textContent = "進捗はアカウントに同期済み";
  } catch (e) {
    syncEl().textContent = "同期できませんでした（このブラウザには保存済み）";
  }
  pushing = false;
  if (pushAgain) { pushAgain = false; push(); }
}
(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const [d, u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!d || !u) return;
    const id = await u.id();
    if (!id) return;
    db = d; uid = id;
    const snap = await Promise.race([db.doc("progress/" + uid).get(), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 10000))]);
    if (snap.exists) {
      const remote = JSON.parse(JSON.stringify(snap.data()));
      if ((remote.updatedAt || 0) > (state.updatedAt || 0)) {
        state = Object.assign(blank(), remote);
        try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
        route();
      } else if (state.updatedAt) push();
    } else if (state.updatedAt) push();
    syncEl().textContent = "進捗はアカウントに同期されます";
  } catch (e) { /* ブラウザ保存のみで動作 */ }
})();

/* ============================================================
   ユーティリティ
   ============================================================ */
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pct = (s, t) => t ? Math.round(s / t * 100) : 0;
const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const fmtDate = iso => { if (!iso) return "—"; const [y, m, d] = iso.slice(0, 10).split("-"); return `${+m}/${+d}`; };
function dayNumber() {
  if (!state.start) return 0;
  const s = new Date(state.start + "T00:00:00"), t = new Date(todayISO() + "T00:00:00");
  return Math.floor((t - s) / 86400000) + 1;
}
function addDays(iso, n) { const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + n); return `${d.getMonth() + 1}/${d.getDate()}`; }
function codeHTML(src) {
  return esc(src).split("\n").map(line => {
    line = line.replace(/(^|\s)(#.*)$/, '$1<span class="c">$2</span>');
    return line.replace(/^(&gt;&gt;&gt;|\.\.\.|\$|&gt;)(?= |$)/, '<span class="p">$1</span>');
  }).join("\n");
}
function unitStatus(id) {
  const r = state.units[id];
  if (r && r.best >= UNIT_PASS) return { key: "pass", label: "合格" };
  if (r) return { key: "prog", label: "再挑戦" };
  const pu = state.placement && state.placement.byUnit[id];
  if (pu && pu[0] === pu[1]) return { key: "skip", label: "診断クリア" };
  return { key: "todo", label: "未着手" };
}
const passedCount = () => UNITS.filter(u => (state.units[u.id] || {}).best >= UNIT_PASS).length;

/* ============================================================
   クイズエンジン（単元テスト・診断・模擬試験で共通）
   ============================================================ */
let session = null; // { kind, unitId, items:[{q, order:[idx], unit}], answers:[], graded, timer }
function buildItems(list, withIdk) {
  return list.map(({ q, unit }) => {
    const order = shuffle(q.c.map((_, i) => i));
    return { q, unit, order, idk: !!withIdk };
  });
}
function quizHTML(items, graded, answers) {
  return `<div class="quiz">${items.map((it, n) => {
    const a = answers[n];
    const ok = graded && a === it.q.a;
    const opts = it.order.map(ci => {
      let cls = "opt";
      if (!graded && a === ci) cls += " sel";
      if (graded && ci === it.q.a) cls += " right";
      if (graded && a === ci && ci !== it.q.a) cls += " wrong";
      const text = /[぀-ヿ一-鿿]/.test(it.q.c[ci]) ? esc(it.q.c[ci]) : `<code>${esc(it.q.c[ci])}</code>`;
      return `<label class="${cls}"><input type="radio" id="q${n}o${ci}" name="q${n}" value="${ci}" ${a === ci ? "checked" : ""} ${graded ? "disabled" : ""}><span>${text}</span></label>`;
    }).join("") + (it.idk ? `<label class="opt idk${!graded && a === -1 ? " sel" : ""}${graded && a === -1 ? " wrong" : ""}"><input type="radio" id="q${n}idk" name="q${n}" value="-1" ${a === -1 ? "checked" : ""} ${graded ? "disabled" : ""}><span>わからない</span></label>` : "");
    return `<section class="q${graded ? " graded " + (ok ? "ok" : "ng") : ""}" id="qs${n}">
      <div class="qh"><span class="qn">Q${n + 1}</span><p class="qt">${esc(it.q.q)}</p>${graded ? `<span class="verdict-tag ${ok ? "ok" : "ng"}">${ok ? "正解" : "不正解"}</span>` : ""}</div>
      ${it.q.code ? `<pre>${codeHTML(it.q.code)}</pre>` : ""}
      <div class="opts" role="radiogroup">${opts}</div>
      ${graded ? `<div class="exp"><b>解説</b>　${it.q.e}${it.unit && session.kind !== "unit" ? `　<a href="#u${it.unit}">→ 単元${it.unit}</a>` : ""}</div>` : ""}
    </section>`;
  }).join("")}</div>`;
}
function bindQuiz() {
  $app.querySelectorAll('.quiz input[type=radio]').forEach(inp => inp.addEventListener("change", e => {
    const n = +e.target.name.slice(1);
    session.answers[n] = +e.target.value;
    const sec = document.getElementById("qs" + n);
    sec.querySelectorAll(".opt").forEach(l => l.classList.toggle("sel", l.querySelector("input").checked));
    updateCount();
  }));
}
function updateCount() {
  const el = document.getElementById("answered");
  if (el) el.textContent = `${session.answers.filter(a => a !== undefined).length} / ${session.items.length} 問回答`;
}
function grade() {
  let score = 0; const byUnit = {};
  session.items.forEach((it, n) => {
    const ok = session.answers[n] === it.q.a;
    if (ok) score++;
    if (it.unit) { byUnit[it.unit] = byUnit[it.unit] || [0, 0]; byUnit[it.unit][1]++; if (ok) byUnit[it.unit][0]++; }
  });
  session.graded = true;
  return { score, total: session.items.length, byUnit };
}

  if (sd) sd.addEventListener("change", () => { if (sd.value) { state.start = sd.value; save(); viewHome(); } });
  document.getElementById("resetBtn").addEventListener("click", () => {
    const row = document.getElementById("resetRow");
    row.innerHTML = `<div class="confirm">診断結果・単元テスト・模擬試験の記録がすべて消えます。<button class="btn small" id="resetYes">消去する</button><button class="btn small ghost" id="resetNo">やめる</button></div>`;
    document.getElementById("resetNo").onclick = viewHome;
    document.getElementById("resetYes").onclick = () => { state = blank(); save(); viewHome(); };
  });
}

/* ============================================================
   画面：レベル診断
   ============================================================ */
function viewPlacement() {
  if (!session || session.kind !== "placement") {
    session = { kind: "placement", items: buildItems(UNITS.flatMap(u => u.place.map(q => ({ q, unit: u.id }))), true), answers: [], graded: false };
  }
  const s = session;
  let head = `<section class="stack">
    <div class="crumbs"><a href="#">ホーム</a><span>›</span><span>レベル診断</span></div>
    <span class="eyebrow">STEP 1</span><h1>レベル診断</h1>
    <p class="lead">全12単元から2問ずつ、計24問。まだ習っていない内容が出て当然です。わからないときは迷わず「わからない」を選んでください。</p>
  </section>`;
  let result = "";
  if (s.graded) {
    const r = s.result, rate = pct(r.score, r.total), lv = LEVELS.filter(l => rate >= l.min).pop();
    result = `<section class="result ${rate >= 65 ? "pass" : ""}">
      <p class="meta">診断結果</p>
      <div class="big">${r.score}<small> / ${r.total}問（${rate}%）</small></div>
      <p><span class="lv-badge">${lv.name}</span>　${lv.text}</p>
      <div class="row"><a class="btn primary" href="#">学習プランを見る</a><a class="btn" href="#u1">単元1から始める</a></div>
      <p class="notice">下に各問題の解説があります。間違えた問題の解説は、該当する単元で詳しく学べます。</p>
    </section>`;
  }
  $app.innerHTML = head + result + quizHTML(s.items, s.graded, s.answers) + (s.graded ? "" : `
    <div class="submitbar"><span class="meta" id="answered"></span><button class="btn primary" id="submit">採点する</button></div>`);
  if (!s.graded) {
    bindQuiz(); updateCount();
    document.getElementById("submit").onclick = () => {
      const missing = s.items.findIndex((_, n) => s.answers[n] === undefined);
      if (missing >= 0) { document.getElementById("qs" + missing).scrollIntoView({ behavior: "smooth", block: "center" }); document.getElementById("answered").textContent = `Q${missing + 1} が未回答です（わからなければ「わからない」を選択）`; return; }
      const r = grade(); s.result = r;
      state.placement = { score: r.score, total: r.total, byUnit: r.byUnit, date: todayISO() };
      if (!state.start) state.start = todayISO();
      save(); viewPlacement(); window.scrollTo(0, 0);
    };
  }
}

/* ============================================================
   画面：単元（レッスン＋小テスト）
   ============================================================ */
function viewUnit(id) {
  const u = UNIT[id]; if (!u) return viewHome();
  if (!session || session.kind !== "unit" || session.unitId !== id) {
    session = { kind: "unit", unitId: id, items: buildItems(u.quiz.map(q => ({ q, unit: id }))), answers: [], graded: false, started: false };
  }
  const s = session, rec = state.units[id], st = unitStatus(id);
  const pu = state.placement && state.placement.byUnit[id];
  const next = UNIT[id + 1];

  let html = `<section class="lesson-head">
    <div class="crumbs"><a href="#">ホーム</a><span>›</span><span>単元 ${id}</span></div>
    <span class="eyebrow">単元 ${id} / 12 · Day ${u.days.join("・")} · チュートリアル${u.ch}</span>
    <h1>${esc(u.title)}</h1>
    <p class="lead">${u.intro}</p>
    <div class="row"><span class="chip ${st.key}">${st.label}</span>
      <span class="meta">出題目安 <b>${u.weight}</b>${rec ? `　·　最高 <b>${Math.round(rec.best * 100)}%</b>　·　受験 <b>${rec.attempts}</b>回` : ""}${pu ? `　·　診断 <b>${pu[0]}/${pu[1]}</b>` : ""}</span></div>
    ${st.key === "skip" ? `<p class="notice">レベル診断でこの単元は全問正解でした。要点を流し読みして、小テストから始めても大丈夫です。　<a href="#quiz" id="jumpQuiz">小テストへ移動</a></p>` : ""}
  </section>
  <section class="points">${u.points.map(pt => `<article class="point">
      <h3>${pt.h}</h3>
      ${pt.body ? `<div>${pt.body}</div>` : ""}
      ${pt.code ? `<pre>${codeHTML(pt.code)}</pre>` : ""}
      ${pt.trap ? `<div class="trap">${pt.trap}</div>` : ""}
    </article>`).join("")}</section>
  <section class="stack" id="quizTop">
    <h2>小テスト（${u.quiz.length}問）</h2>
    <p class="lead" style="margin:0">80%以上（${Math.ceil(u.quiz.length * UNIT_PASS)}問以上）で合格。選択肢の順番は受けるたびに入れ替わります。</p>
  </section>`;

  if (s.graded) {
    const r = s.result, ok = r.score / r.total >= UNIT_PASS;
    html += `<section class="result ${ok ? "pass" : "fail"}">
      <div class="big">${r.score}<small> / ${r.total}問（${pct(r.score, r.total)}%）</small></div>
      <p><b>${ok ? "合格です。" : "あと少し。"}</b>${ok ? (next ? "次の単元に進みましょう。" : "全単元が終わったら模擬試験に挑戦しましょう。") : "間違えた問題の解説を読み、上の要点を見直してからもう一度挑戦しましょう。"}</p>
      <div class="row">${ok && next ? `<a class="btn primary" href="#u${next.id}">単元${next.id}へ進む</a>` : ""}${ok && !next ? `<a class="btn primary" href="#mock">模擬試験へ</a>` : ""}<button class="btn${ok ? "" : " primary"}" id="retry">もう一度解く</button><a class="btn ghost" href="#">ホームへ</a></div>
    </section>`;
  }
  html += quizHTML(s.items, s.graded, s.answers);
  if (!s.graded) html += `<div class="submitbar"><span class="meta" id="answered"></span><button class="btn primary" id="submit">採点する</button></div>`;
  $app.innerHTML = html;

  const jq = document.getElementById("jumpQuiz");
  if (jq) jq.onclick = e => { e.preventDefault(); document.getElementById("quizTop").scrollIntoView({ behavior: "smooth" }); };
  if (!s.graded) {
    bindQuiz(); updateCount();
    document.getElementById("submit").onclick = () => {
      const missing = s.items.findIndex((_, n) => s.answers[n] === undefined);
      if (missing >= 0) { document.getElementById("qs" + missing).scrollIntoView({ behavior: "smooth", block: "center" }); document.getElementById("answered").textContent = `Q${missing + 1} が未回答です`; return; }
      const r = grade(); s.result = r;
      const rate = r.score / r.total, prev = state.units[id] || { best: 0, attempts: 0 };
      state.units[id] = { best: Math.max(prev.best, rate), last: rate, attempts: prev.attempts + 1, date: todayISO() };
      save(); viewUnit(id);
      document.getElementById("quizTop").scrollIntoView();
    };
  } else {
    document.getElementById("retry").onclick = () => { session = null; viewUnit(id); document.getElementById("quizTop").scrollIntoView(); };
  }
}

/* ============================================================
   画面：模擬試験
   ============================================================ */
let tick = null;
function viewMock() {
  const s = session && session.kind === "mock" ? session : null;
  if (!s) {
    $app.innerHTML = `<section class="stack">
      <div class="crumbs"><a href="#">ホーム</a><span>›</span><span>模擬試験</span></div>
      <span class="eyebrow">STEP 3</span><h1>模擬試験</h1>
      <p class="lead">本番と同じ <b>40問・60分</b>。全単元から、公式の章別出題比率を目安にランダムに出題します。時間切れになると自動で採点されます。</p>
    </section>
    <section class="panel stack">
      <h3>単元別の出題数</h3>
      <div style="overflow-x:auto"><table class="hist"><thead><tr><th>単元</th><th>内容</th><th>出題数</th></tr></thead><tbody>
      ${UNITS.map(u => `<tr><td class="num">${u.id}</td><td>${esc(u.title)}</td><td class="num">${MOCK_MIX[u.id]}</td></tr>`).join("")}
      </tbody></table></div>
      <p class="notice" style="margin:0">${passedCount() < 12 ? `合格済みの単元は ${passedCount()} / 12 です。未学習の単元があっても受験できますが、Day 28 以降に受けるのがおすすめです。` : "全単元に合格しています。本番のつもりで挑戦しましょう。"}</p>
      <div class="row"><button class="btn primary" id="startMock">60分の模擬試験を始める</button></div>
    </section>`;
    document.getElementById("startMock").onclick = () => {
      const list = [];
      UNITS.forEach(u => shuffle(u.quiz.concat(u.place)).slice(0, MOCK_MIX[u.id]).forEach(q => list.push({ q, unit: u.id })));
      session = { kind: "mock", items: buildItems(list), answers: [], graded: false, startedAt: Date.now() };
      viewMock(); window.scrollTo(0, 0);
    };
    return;
  }
  let html = `<section class="stack">
    <div class="crumbs"><a href="#">ホーム</a><span>›</span><span>模擬試験</span></div>
    <h1>模擬試験</h1></section>`;
  if (s.graded) {
    const r = s.result, ok = r.score / r.total >= PASS_RATE;
    const weak = Object.entries(r.byUnit).filter(([, b]) => b[0] / b[1] < 0.7).map(([id]) => +id);
    html += `<section class="result ${ok ? "pass" : "fail"}">
      <div class="big">${r.score}<small> / ${r.total}問（${pct(r.score, r.total)}%）</small></div>
      <p><b>${ok ? "合格ライン（70%）を超えました。" : `合格ラインまであと ${Math.ceil(r.total * PASS_RATE) - r.score} 問です。`}</b>　所要時間 ${Math.floor(s.sec / 60)}分${s.sec % 60}秒</p>
      ${weak.length ? `<p>正答率70%未満の単元：${weak.map(id => `<a href="#u${id}">単元${id} ${esc(UNIT[id].title)}</a>`).join("、")}</p>` : `<p>すべての単元で70%以上取れています。</p>`}
      <div class="minibars">${UNITS.map(u => { const b = r.byUnit[u.id] || [0, 1]; return `<div><em>${u.id}. ${esc(u.title.split("（")[0])}</em><span class="bar"><i class="${b[0] / b[1] >= 0.7 ? "ok" : "ng"}" style="width:${b[0] / b[1] * 100}%"></i></span><code>${b[0]}/${b[1]}</code></div>`; }).join("")}</div>
      <div class="row"><button class="btn primary" id="again">新しい問題でもう一度</button><a class="btn ghost" href="#">ホームへ</a></div>
    </section>`;
  }
  html += quizHTML(s.items, s.graded, s.answers);
  if (!s.graded) html += `<div class="submitbar"><span class="timer" id="timer">60:00</span><span class="meta" id="answered"></span><span class="row" id="submitWrap"><button class="btn primary" id="submit">提出して採点</button></span></div>`;
  $app.innerHTML = html;

  if (!s.graded) {
    bindQuiz(); updateCount();
    const finish = () => {
      clearInterval(tick); tick = null;
      s.sec = Math.min(MOCK_MIN * 60, Math.round((Date.now() - s.startedAt) / 1000));
      const r = grade(); s.result = r;
      state.mocks.push({ score: r.score, total: r.total, byUnit: r.byUnit, date: todayISO(), sec: s.sec });
      save(); viewMock(); window.scrollTo(0, 0);
    };
    const upd = () => {
      const left = MOCK_MIN * 60 - Math.floor((Date.now() - s.startedAt) / 1000);
      const el = document.getElementById("timer"); if (!el) { clearInterval(tick); tick = null; return; }
      if (left <= 0) return finish();
      el.textContent = `${String(Math.floor(left / 60)).padStart(2, "0")}:${String(left % 60).padStart(2, "0")}`;
      el.classList.toggle("low", left <= 300);
    };
    clearInterval(tick); tick = setInterval(upd, 1000); upd();
    document.getElementById("submit").onclick = () => {
      const blankN = s.items.filter((_, n) => s.answers[n] === undefined).length;
      if (blankN) {
        const w = document.getElementById("submitWrap");
        w.innerHTML = `<span class="meta">未回答が ${blankN} 問あります。</span><button class="btn small primary" id="sure">このまま提出</button><button class="btn small ghost" id="back">戻る</button>`;
        document.getElementById("sure").onclick = finish;
        document.getElementById("back").onclick = () => { w.innerHTML = `<button class="btn primary" id="submit2">提出して採点</button>`; document.getElementById("submit2").onclick = finish; };
      } else finish();
    };
  } else {
    document.getElementById("again").onclick = () => { session = null; viewMock(); };
  }
}

/* ============================================================
   ルーティング
   ============================================================ */
function route() {
  const h = location.hash.replace("#", "");
  if (tick && h !== "mock") { clearInterval(tick); tick = null; }
  if (h === "placement") viewPlacement();
  else if (/^u\d+$/.test(h)) viewUnit(+h.slice(1));
  else if (h === "mock") viewMock();
  else viewHome();
}
let lastHash = location.hash;
window.addEventListener("hashchange", () => {
  const h = location.hash;
  // 別の画面に移ったら解答中のセッションを破棄（模擬試験・診断は意図せず消えないよう、同じ画面に戻れば継続）
  if (session && session.graded && h !== lastHash) session = null;
  lastHash = h; route(); window.scrollTo(0, 0);
});
route();
</script>
